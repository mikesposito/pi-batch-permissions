<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="pi-seatbelt logo">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1e293b"/>
			<stop offset="1" stop-color="#0b1220"/>
		</linearGradient>
		<linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f8fafc"/>
			<stop offset="1" stop-color="#cbd5e1"/>
		</linearGradient>
		<linearGradient id="buckle" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbbf24"/>
			<stop offset="1" stop-color="#f59e0b"/>
		</linearGradient>
		<clipPath id="frame">
			<rect x="16" y="16" width="480" height="480" rx="112"/>
		</clipPath>
	</defs>
	<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
	<!-- the belt: full diagonal, entering and leaving off-frame -->
	<g clip-path="url(#frame)">
		<g transform="rotate(50 256 256)">
			<rect x="-140" y="220" width="792" height="72" fill="url(#strap)" stroke="#0b1220" stroke-width="8"/>
			<line x1="-120" y1="256" x2="640" y2="256" stroke="#64748b" stroke-width="6" stroke-dasharray="16 14" stroke-linecap="round"/>
		</g>
	</g>
	<!-- buckle riding on the belt, strap continues past it out of frame -->
	<g transform="rotate(50 301 310)">
		<rect x="243" y="259" width="116" height="102" rx="24" fill="url(#buckle)" stroke="#0b1220" stroke-width="8"/>
		<rect x="269" y="297" width="64" height="26" rx="10" fill="#0b1220"/>
		<circle cx="301" cy="310" r="7" fill="#4ade80"/>
	</g>
</svg>
