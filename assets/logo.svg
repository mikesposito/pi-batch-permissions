<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="pi-seatbelt logo">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1e293b"/>
			<stop offset="1" stop-color="#0b1220"/>
		</linearGradient>
		<linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f8fafc"/>
			<stop offset="1" stop-color="#cbd5e1"/>
		</linearGradient>
		<linearGradient id="buckle" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbbf24"/>
			<stop offset="1" stop-color="#f59e0b"/>
		</linearGradient>
	</defs>
	<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
	<!-- pi legs -->
	<rect x="150" y="199" width="56" height="170" rx="28" fill="url(#strap)"/>
	<rect x="306" y="199" width="56" height="170" rx="28" fill="url(#strap)"/>
	<!-- crossbar as the strap -->
	<rect x="72" y="155" width="316" height="56" rx="28" fill="url(#strap)"/>
	<!-- stitching -->
	<line x1="98" y1="183" x2="366" y2="183" stroke="#64748b" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
	<!-- buckle -->
	<rect x="376" y="143" width="88" height="80" rx="20" fill="url(#buckle)"/>
	<rect x="396" y="171" width="48" height="24" rx="8" fill="#0b1220"/>
	<circle cx="420" cy="183" r="6" fill="#4ade80"/>
</svg>
