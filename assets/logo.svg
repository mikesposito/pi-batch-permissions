<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="pi-seatbelt logo">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1e293b"/>
			<stop offset="1" stop-color="#0b1220"/>
		</linearGradient>
		<linearGradient id="strap" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#f8fafc"/>
			<stop offset="1" stop-color="#cbd5e1"/>
		</linearGradient>
		<linearGradient id="buckle" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbbf24"/>
			<stop offset="1" stop-color="#f59e0b"/>
		</linearGradient>
		<clipPath id="frame">
			<rect x="16" y="16" width="480" height="480" rx="112"/>
		</clipPath>
	</defs>
	<rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
	<!-- pi glyph -->
	<g fill="url(#strap)">
		<rect x="138" y="173" width="54" height="197" rx="27"/>
		<rect x="324" y="173" width="54" height="197" rx="27"/>
		<rect x="118" y="130" width="280" height="54" rx="27"/>
	</g>
	<!-- diagonal shoulder belt, clipped so it enters from off-frame -->
	<g clip-path="url(#frame)">
		<g transform="rotate(55 186 247)">
			<rect x="-31" y="223" width="434" height="48" rx="24" fill="url(#strap)" stroke="#0b1220" stroke-width="8"/>
			<line x1="-20" y1="247" x2="160" y2="247" stroke="#64748b" stroke-width="6" stroke-dasharray="14 12" stroke-linecap="round"/>
		</g>
	</g>
	<!-- buckle where the belt ends, below the gap between the legs -->
	<g transform="rotate(55 310 430)">
		<rect x="262" y="388" width="96" height="84" rx="20" fill="url(#buckle)" stroke="#0b1220" stroke-width="8"/>
		<rect x="284" y="418" width="52" height="24" rx="8" fill="#0b1220"/>
		<circle cx="310" cy="430" r="6" fill="#4ade80"/>
	</g>
</svg>
